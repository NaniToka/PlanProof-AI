[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "planproof-ai"
version = "0.1.0"
description = "PlanProof AI: AI-powered event planning and crisis recovery assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "PlanProof AI Contributors" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
asyncio_mode = "auto"
markers = [
    "asyncio: marks tests as asynchronous",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "generate_dataset.py",
    "data/generate_dataset.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = []
